name: Release

# Automated releases via release-please (conventional commits), mirroring
# dcc-mcp-office's release flow.
#
# Every push to main runs release-please, which keeps a release PR up to date.
# When that PR is merged, release-please creates the GitHub release and tag;
# this workflow then rebuilds the standalone binary and attaches it, so
# downstream consumers always have a versioned, CI-verified
# dcc-mcp-powerpoint.exe to consume.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to attach assets to (optional; used to re-attach after a failed publish)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (user-owned) is required: PRs opened with the default
          # GITHUB_TOKEN do not trigger pull_request workflows, so CI would
          # never run on release PRs.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable

      # Pinned host-source ref: the dependency build (dcc-office-host) is
      # produced by dcc-mcp-office's Release workflow; we build it here from
      # the pinned source so packaging stays reproducible. Bump this ref when
      # the office dependency changes; switch to downloading the published
      # artifact once dcc-mcp-office cuts releases.
      - name: Checkout dcc-mcp-office (host source)
        uses: actions/checkout@v4
        with:
          repository: dcc-mcp/dcc-mcp-office
          ref: b1004bfb61d4af727d5f5bdd8bc1b4e10c88c7dd
          path: _office

      - name: Install PyOxidizer
        run: python -m pip install pyoxidizer

      - name: Build standalone (host publish + pyoxidizer)
        run: python tools/build_binary.py --host-source _office

      - name: Smoke test — version + compile via bundled host
        shell: pwsh
        run: |
          Get-ChildItem dist/binary | Select-Object -First 5 Name, Length
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/binary/dcc-mcp-powerpoint.exe"
          if (-not (Test-Path $exe)) { Write-Error "standalone exe missing: $exe"; exit 1 }
          & $exe --version
          $smoke = Join-Path $env:RUNNER_TEMP "smoke.pptx"
          & $exe compile --input examples/dcc_mcp_framework_intro.json --output $smoke
          if (-not (Test-Path $smoke)) { Write-Error "compile produced no output"; exit 1 }
          & $exe inspect --input $smoke

      - name: Upload standalone artifacts to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag from the release job, or the manual dispatch input when
          # re-attaching assets to an existing release.
          TARGET_TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag_name }}
        run: |
          $tag = $env:TARGET_TAG
          if (-not $tag) { Write-Error "no target tag"; exit 1 }
          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist/dcc-mcp-powerpoint-windows-x64.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/dist/binary/*" -DestinationPath $bundle -Force
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          $checksum = "$bundle.sha256"
          $assetName = [IO.Path]::GetFileName($bundle)
          [IO.File]::WriteAllText($checksum, "$digest  $assetName`n", [Text.UTF8Encoding]::new($false))
          gh release upload $tag $bundle $checksum --clobber --repo dcc-mcp/dcc-mcp-powerpoint
