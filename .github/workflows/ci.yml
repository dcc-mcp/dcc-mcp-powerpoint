name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Skill lint (official dcc-mcp-cli validator)
        shell: pwsh
        run: |
          # dcc-mcp-cli ships through the dcc-mcp-core release train, not pip.
          Invoke-WebRequest -Uri "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v0.20.6/dcc-mcp-cli-windows-x86_64.exe" -OutFile "$env:RUNNER_TEMP\dcc-mcp-cli.exe"
          & "$env:RUNNER_TEMP\dcc-mcp-cli.exe" lint src/dcc_mcp_powerpoint/skills --warnings-as-errors --non-interactive
      - name: Pytest
        run: pytest -q
