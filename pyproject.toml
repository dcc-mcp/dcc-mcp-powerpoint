[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-powerpoint"
version = "0.1.0"
description = "PowerPoint adapter for the DCC-MCP ecosystem — deck generation, slide composition and review decks over the dcc-mcp-office runtime"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["powerpoint", "office", "mcp", "dcc", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

dependencies = [
    # Release Train anchor: same core the other adapters pin.
    "dcc-mcp-core>=0.18.2,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "hatchling",
    "build",
    "python-pptx>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]
sidecar = [
    "dcc-mcp-server>=0.17.43",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-PowerPoint"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_powerpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
