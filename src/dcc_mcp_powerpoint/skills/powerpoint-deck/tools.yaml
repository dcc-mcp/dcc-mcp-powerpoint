tools:
- name: generate_deck
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  job_strategy: monolithic
  annotations:
    idempotent_hint: true
  description: >-
    Compile a Deck IR JSON (office-ir/1.0 presentation envelope) into an
    editable 16:9 PPTX via the Open XML backend, then render PDF + per-slide
    PNG previews through the desktop COM backend when PowerPoint is
    installed. Generated decks are semantic-layer tagged (background/
    decoration/header/content/accent/footer) for the powerpoint-layers
    skill. Returns artifacts, backend info and a structural validation
    report. Use for any deck creation task.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the Deck IR JSON file
      output_dir:
        type: string
        description: Directory for pptx/pdf/preview artifacts
      render:
        type: boolean
        description: Run the COM render step (PDF + previews) when Office is available
        default: true
      previews:
        type: boolean
        description: Export per-slide PNG previews during render
        default: true
    required: [input, output_dir]
  call_examples:
  - arguments: {"input": "deck.json", "output_dir": "out"}
    note: Compile a deck with PDF + previews when Office is installed
  - arguments: {"input": "deck.json", "output_dir": "out", "render": false}
    note: Compile the PPTX only, skip the COM render step
- name: validate_deck
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Validate a Deck IR JSON (contract + structural checks) or check produced
    artifacts exist and are non-empty. Returns ok/checks/warnings.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the Deck IR JSON file, or a directory of artifacts
    required: [input]
  call_examples:
  - arguments: {"input": "deck.json"}
    note: Validate a Deck IR envelope before compiling
  - arguments: {"input": "out"}
    note: Check that produced artifacts exist and are non-empty
- name: analyze_deck
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Analyze a PPTX for issues with path addressing (/slide[i]/shape[j]) and
    concrete fix hints: structure (text overflow via real font metrics,
    slide-bounds), format (brand fonts, WCAG contrast), content (alt text,
    speaker notes). Read-only; undecidable checks are skipped, never guessed.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the PPTX file
    required: [input]
  call_examples:
  - arguments: {"input": "deck.pptx"}
    note: Analyze a deck before review or after a patch
- name: inventory_deck
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Read-only inventory of a PPTX before editing or repair: slide count, shape
    and picture counts, speaker-note coverage, and pictures missing alt text.
    Run before touching a branded template or a deck you did not generate.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the PPTX file
    required: [input]
  call_examples:
  - arguments: {"input": "deck.pptx"}
    note: Inventory a deck before editing or repairing it
- name: render_deck
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  job_strategy: monolithic
  annotations:
    idempotent_hint: true
  description: >-
    Render an existing PPTX to PDF and per-slide PNG previews via the desktop
    COM backend. Reports OFFICE_APP_NOT_INSTALLED explicitly when PowerPoint
    COM is unavailable.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the PPTX file
      output_dir:
        type: string
        description: Directory for pdf/preview artifacts
      pdf:
        type: boolean
        description: Export PDF
        default: true
      previews:
        type: boolean
        description: Export per-slide PNG previews
        default: true
    required: [input, output_dir]
  call_examples:
  - arguments: {"input": "deck.pptx", "output_dir": "out"}
    note: Render PDF + per-slide previews of an existing deck
  - arguments: {"input": "deck.pptx", "output_dir": "out", "pdf": true, "previews": false}
    note: Export only the PDF
